apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
name: k8s-local
networking:
  ipFamily: ipv4
  disableDefaultCNI: true
  kubeProxyMode: "none"
  podSubnet: "10.0.0.0/16"
  serviceSubnet: "10.1.0.0/16"
nodes:
  - role: control-plane
    labels:
      control-plane: true
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            register-with-taints: "control-plane=presence:NoSchedule"
  - role: worker
  - role: worker
  - role: worker

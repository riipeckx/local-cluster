apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: webapp-color
  namespace: webapp-color
spec:
  parentRefs:
    - name: shared-gw
      namespace: kgateway-system
      sectionName: https
  hostnames:
    - color.k8s.internal
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: webapp-color
          port: 8080

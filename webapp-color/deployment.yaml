apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-color
  namespace: webapp-color
  labels:
    app: webapp-color
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp-color
  template:
    metadata:
      labels:
        app: webapp-color
    spec:
      containers:
        - name: webapp-color
          image: kodekloud/webapp-color:latest
          ports:
            - containerPort: 8080
          env:
            - name: APP_COLOR
              value: blue
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

[tools]
kind = "0.33.0"
kubectl = "1.37"
kustomize = "5.8.3"

[env]
CLUSTER = "k8s-local"
CTX = "kind-k8s-local"

[tasks.apply]
description = "Apply root Kustomize manifests"
run = 'kustomize build . | kubectl --context "$CTX" apply -f -'

[tasks.down]
description = "Delete local Kind cluster"
run = 'kind delete cluster --name "$CLUSTER"'

[tasks.hosts]
description = "Sync gateway IP and HTTPRoute hostnames to /etc/hosts"
run = '''
kubectl --context "$CTX" wait --for=condition=Programmed -n kgateway-system gateway/shared-gw --timeout=120s >/dev/null
IP=$(kubectl --context "$CTX" get gateway shared-gw -n kgateway-system -o jsonpath='{.status.addresses[0].value}')
HOSTS=$(kubectl --context "$CTX" get httproute -A -o jsonpath='{.items[*].spec.hostnames[*]}' | tr ' ' '\n' | sort -u | xargs)
TMP=$(mktemp) && trap 'rm -f "$TMP"' EXIT
{ grep -vE '# k8s-local$|k8s\.(local|internal)' /etc/hosts || true; echo "$IP $(echo "k8s.internal $HOSTS" | xargs) # k8s-local"; } > "$TMP"
sudo tee /etc/hosts < "$TMP" >/dev/null
'''

[tasks.status]
description = "Show cluster, gateway, TLS and pod status"
quiet = true
run = '''
if ! kind get clusters 2>/dev/null | grep -qx "$CLUSTER"; then
  printf "\033[1;31m●\033[0m Cluster \033[1m%s\033[0m is down\n" "$CLUSTER"
  exit 0
fi
printf "\033[1;32m●\033[0m Cluster \033[1m%s\033[0m (%s)\n" "$CLUSTER" "$CTX"
printf "\n\033[1;36m▸ Nodes\033[0m\n"
kubectl --context "$CTX" get nodes -o custom-columns='NAME:.metadata.name,READY:.status.conditions[?(@.type=="Ready")].status,VERSION:.status.nodeInfo.kubeletVersion,IP:.status.addresses[?(@.type=="InternalIP")].address,TAINTS:.spec.taints[*].key'
printf "\n\033[1;36m▸ Gateway\033[0m\n"
kubectl --context "$CTX" get gateway -A || true
printf "\n\033[1;36m▸ Certificates\033[0m\n"
kubectl --context "$CTX" get certificate -A || true
printf "\n\033[1;36m▸ HTTPRoutes\033[0m\n"
kubectl --context "$CTX" get httproute -A || true
printf "\n\033[1;36m▸ Pods\033[0m\n"
kubectl --context "$CTX" get pods -A -o custom-columns='NAMESPACE:.metadata.namespace,NAME:.metadata.name,READY:.status.conditions[?(@.type=="Ready")].status,STATUS:.status.phase,RESTARTS:.status.containerStatuses[0].restartCount,NODE:.spec.nodeName'
'''

[tasks.trust-ca]
description = "Trust local Root CA in system trust store"
run = '''
kubectl --context "$CTX" wait --for=condition=Ready -n cert-manager certificate/k8s-local-ca --timeout=60s >/dev/null
CRT=$(mktemp) && trap 'rm -f "$CRT"' EXIT
kubectl --context "$CTX" get secret -n cert-manager k8s-local-ca-secret -o jsonpath='{.data.tls\.crt}' | base64 -d > "$CRT"
if [ "$(uname -s)" = "Darwin" ]; then
  sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain "$CRT"
else
  sudo cp "$CRT" /etc/pki/ca-trust/source/anchors/k8s-local-ca.crt && sudo update-ca-trust
fi
'''

[tasks.up]
description = "Create and bootstrap local cluster"
quiet = true
run = '''
set -eo pipefail

step() {
  local b=("" "██░░░░░░░░" "████░░░░░░" "██████░░░░" "████████░░" "██████████")
  printf "\033[1;36m[%s]\033[0m \033[1m(%d/5) %s...\033[0m\n" "${b[$1]}" "$1" "$2"
  local out
  if ! out=$(eval "$3" 2>&1); then
    printf "\033[1;31m✘ Error during '%s':\033[0m\n%s\n" "$2" "$out"
    return 1
  fi
}

step 1 "Creating Kind cluster" \
  'kind get clusters 2>/dev/null | grep -qx "$CLUSTER" || kind create cluster --config kind/local-cluster.yaml'

step 2 "Installing Gateway API CRDs" \
  'kustomize build gateway-api | kubectl --context "$CTX" apply --server-side -f -'

step 3 "Deploying Cilium CNI" \
  'kustomize build cilium | kubectl --context "$CTX" apply --server-side --force-conflicts -f - && kubectl --context "$CTX" -n kube-system rollout status ds/cilium --timeout=180s && kubectl --context "$CTX" -n kube-system rollout status deploy/cilium-operator --timeout=180s'

step 4 "Deploying cert-manager & kgateway" \
  'kustomize build cert-manager | kubectl --context "$CTX" apply --server-side -f - && kustomize build kgateway | kubectl --context "$CTX" apply --server-side -f - && kubectl --context "$CTX" wait --for=condition=Available -n cert-manager deploy --all --timeout=120s && kubectl --context "$CTX" wait --for=condition=Available -n kgateway-system deploy/kgateway --timeout=120s'

sudo -n true 2>/dev/null || sudo -v

step 5 "Applying root manifests & syncing hosts" \
  'mise run apply && mise run hosts'

printf "\n\033[1;32m✔ Cluster is up and ready!\033[0m Run \033[36mmise run status\033[0m to inspect.\n"
'''
